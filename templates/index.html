<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python K8s App</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="bg-orbs">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <main class="card">
    <div class="badge" id="status-badge">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Checking…</span>
    </div>

    <div class="logo">🐍☸️</div>
    <h1>Hello from Python Kubernetes from Piersoft!</h1>
    <p class="subtitle">A tiny Flask app, happily running in a pod.</p>

    <div class="grid">
      <div class="stat">
        <span class="stat-label">Environment</span>
        <span class="stat-value">{{ env }}</span>
      </div>
      <div class="stat">
        <span class="stat-label">Version</span>
        <span class="stat-value">v{{ version }}</span>
      </div>
      <div class="stat">
        <span class="stat-label">Hostname</span>
        <span class="stat-value" title="{{ hostname }}">{{ hostname }}</span>
      </div>
      <div class="stat">
        <span class="stat-label">Uptime</span>
        <span class="stat-value" id="uptime">–</span>
      </div>
    </div>

    <div class="links">
      <a class="btn" href="/api/info" target="_blank" rel="noopener">API: /api/info</a>
      <a class="btn btn-outline" href="/health" target="_blank" rel="noopener">API: /health</a>
    </div>
  </main>

  <footer>Served from <strong>{{ hostname }}</strong></footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
